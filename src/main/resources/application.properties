# Spring Boot Configuration for Threat Trace Platform
spring.application.name=Threat Trace

# Server Configuration
server.port=8080

# Database Configuration (MySQL 8.0+)
spring.datasource.url=jdbc:mysql://localhost:3306/threat_trace_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Upload File Limit Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.threattrace=DEBUG
